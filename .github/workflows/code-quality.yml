name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for accidental debug files
        run: |
          echo "Checking for accidental debug files..."
          find . -name "*.pyc" -o -name "*.pyo" -o -name "*.pyd" -o -name "*.log" -o -name "*.tmp" -o -name "*.backup" | head -10
          echo "Debug file check complete"

      - name: Detect suspicious hardcoded secrets
        run: |
          echo "Checking for hardcoded secrets..."
          grep -r "API_KEY\|SECRET\|PASSWORD\|TOKEN" --include="*.gd" --include="*.tscn" --include="*.json" . 2>/dev/null | grep -v "example\|test" || echo "No obvious secrets found"
          echo "Secret scan complete"

      - name: Validate documentation
        run: |
          echo "Validating documentation..."
          for file in README.md CONTRIBUTING.md DEVELOPMENT.md CHANGELOG.md; do
            if [ -f "$file" ]; then
              echo "Found $file"
            fi
          done

      - name: Check for unfinished work
        run: |
          echo "Checking for TODO comments..."
          for file in scripts/**/*.gd scenes/**/*.tscn; do
            if grep -q "TODO:" "$file" 2>/dev/null; then
              echo "WARNING: $file contains TODO comments"
            fi
          done

      - name: Validate project structure
        run: |
          echo "Validating project structure..."
          test -f project.godot && echo "✓ project.godot found"
          test -d scenes && echo "✓ scenes directory found"
          test -d scripts && echo "✓ scripts directory found"
          test -f LICENSE && echo "✓ LICENSE found"
          echo "Project structure validation complete"

      - name: Create requirements checklist
        if: false
        run: |
          echo "## Development Checklist" > DEVELOPMENT_CHECKLIST.md
          echo "- [ ] Initialize GitHub repository" >> DEVELOPMENT_CHECKLIST.md
          echo "- [ ] Set up CI/CD pipeline" >> DEVELOPMENT_CHECKLIST.md
          echo "- [ ] Build and test Android APK" >> DEVELOPMENT_CHECKLIST.md
          echo "- [ ] Create release build" >> DEVELOPMENT_CHECKLIST.md
          echo "- [ ] Write documentation" >> DEVELOPMENT_CHECKLIST.md
          echo "- [ ] Add unit tests" >> DEVELOPMENT_CHECKLIST.md
          echo "- [ ] Optimize for mobile performance" >> DEVELOPMENT_CHECKLIST.md