name: Godot Validation

on:
  push:
    branches: [main, develop, android]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
          sudo mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Run project resource and audio validation
        run: python3 tools/validate_project.py

      - name: Validate project structure
        run: |
          test -f project.godot
          test -f scenes/main/Main.tscn
          test -f scripts/main.gd
          test -d scripts/autoload

      - name: Import and parse all project scripts/scenes
        run: godot --headless --editor --path . --quit

      - name: Smoke-test main scene
        run: godot --headless --path . --quit-after 10
